services:
  # Service de l'application ASP.NET Core
  app:
    build:
      # Le contexte est le répertoire courant (où se trouve ce fichier)
      context: .
      dockerfile: Dockerfile
    container_name: ch_manage_app
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      # Chaîne de connexion vers le service PostgreSQL
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=ch_manage_db;Username=postgres;Password=password"

  # Service de la base de données PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: ch_manage_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ch_manage_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
